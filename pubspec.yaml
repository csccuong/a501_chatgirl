name: cscmobi_app
description: Base project Flutter & Getx
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
#  sdk: ">=2.17.1 <3.0.0"
  sdk: '>=3.1.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  easy_ads_flutter:
    path: ./modules/easy-ads-master

  cupertino_icons: ^1.0.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  fluttertoast: ^8.2.12
  get: ^4.7.2
  shared_preferences: ^2.0.10
  flutter_svg: ^2.0.10+1
  overlay_support: ^2.0.1
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.3.0
  firebase_remote_config: ^5.0.1
  firebase_crashlytics: ^4.1.5
  http: ^1.2.2
  flutter_fgbg: ^0.7.1
  is_lock_screen2: ^2.0.3
  #  adjust_sdk: ^4.38.1
  adjust_sdk: ^5.6.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.9.0
  asn1lib: ^1.5.3
  package_info_plus: ^8.0.2
  iabtcf_consent_info: ^3.1.0
  flutter_rating_bar: ^4.0.1
  encrypt: ^5.0.3
  share_plus: ^11.0.0
  permission_handler: ^12.0.1
  facebook_app_events: ^0.20.1
  flutter_easyloading: ^3.0.5
  carousel_slider: ^5.1.1
  app_tracking_transparency: ^2.0.6+1
  open_settings_plus: ^0.5.0
  connectivity_plus: ^6.1.4
  internet_connection_checker: ^3.0.1
  dots_indicator: ^4.0.1
  auto_size_text: ^3.0.0
  modal_bottom_sheet: ^3.0.0
  device_info_plus: ^10.1.2
  android_id: ^0.4.0
  in_app_purchase: ^3.3.0
  in_app_purchase_storekit: ^0.4.4
  flutter_local_notifications: ^20.1.0
  flutter_client_sse: any
  lottie: ^3.3.2
#  realm:
  realm: ^20.2.0
  flutter_markdown:
  photo_view: ^0.15.0
  shimmer_animation: ^2.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/png/splash_thumb.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  assets:
    - assets/svg/
    - assets/png/
    - assets/json/
    - assets/flag/
    - assets/icons/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Black.ttf
          weight: 900
        - asset: assets/fonts/BeVietnamPro-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BeVietnamPro-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/BeVietnamPro-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/BeVietnamPro-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/BeVietnamPro-Italic.ttf
          style: italic
        - asset: assets/fonts/BeVietnamPro-Light.ttf
          weight: 300
        - asset: assets/fonts/BeVietnamPro-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
